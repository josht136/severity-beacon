name: Severity Beacon Lights
version: "0.8.2"
slug: severity_beacon
description: >-
  Poll Zabbix problem.get and drive Home Assistant RGB lights — multi-light
  registry, mute buttons, audio-only and lights-only mute, Base/Recovery, Steady|Pattern, audio, Ingress UI.
url: https://github.com/josht136/severity-beacon
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
init: false
startup: application
boot: manual
homeassistant_api: true
hassio_api: false
stdin: true
ingress: true
ingress_port: 8099
panel_icon: mdi:alarm-light
panel_title: Severity Beacon
map: []
