configuration:
  zabbix_url:
    name: Zabbix URL
    description: Base URL of the Zabbix frontend (api_jsonrpc.php is appended if missing).
  zabbix_api_token:
    name: Zabbix API token
    description: Bearer API token (User → API tokens). Prefer a read-only token.
  light_entity_id:
    name: Light entity
    description: Home Assistant light entity_id to control (must support rgb_color).
  poll_interval_seconds:
    name: Poll interval (seconds)
    description: How often to call Zabbix problem.get (Severity_Beacon default is 15; this add-on defaults to 45).
  host_group_id:
    name: Host group ID (optional)
    description: Optional Zabbix host group id (Severity_Beacon -g). Empty = all hosts.
  severities:
    name: Severities
    description: Comma-separated Zabbix severity numbers to include (default 2,3,4,5).
  brightness:
    name: Brightness
    description: Light brightness 1–255 when setting color.
  color_none:
    name: Color — no problems
    description: RGB "R,G,B" when there are no matching open problems (default green).
  color_low:
    name: Color — low / mid severity
    description: RGB "R,G,B" when max severity is below the high threshold (default orange).
  color_high:
    name: Color — high severity
    description: RGB "R,G,B" when max severity is at or above the high threshold (default red).
  high_severity_threshold:
    name: High severity threshold
    description: Severities >= this value use color_high (default 4 = High/Disaster).
